<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat en vivo</title>
<style>
  :root {
    --fondo: #eef2f1;
    --panel: #ffffff;
    --texto: #1c2b2a;
    --suave: #5d706e;
    --borde: #d3dddb;
    --propio: #0f6b5c;
    --propio-texto: #ffffff;
    --ajeno: #e3ebe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #101716;
      --panel: #182120;
      --texto: #e6efed;
      --suave: #8ea4a1;
      --borde: #2b3a38;
      --propio: #2aa58f;
      --propio-texto: #08201b;
      --ajeno: #243130;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: var(--fondo);
    color: var(--texto);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .chat {
    width: min(560px, 100%);
    height: min(720px, 100%);
    background: var(--panel);
    border: 1px solid var(--borde);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--borde);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 1.05rem; margin: 0; }
  #estado { font-size: .85rem; color: var(--suave); }
  #mensajes {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 8px 12px;
    background: var(--ajeno);
    border-radius: 12px 12px 12px 3px;
    align-self: flex-start;
    overflow-wrap: anywhere;
  }
  .msg.propio {
    align-self: flex-end;
    background: var(--propio);
    color: var(--propio-texto);
    border-radius: 12px 12px 3px 12px;
  }
  .msg .meta { font-size: .75rem; opacity: .75; margin-bottom: 2px; }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--borde);
  }
  input {
    font: inherit;
    color: inherit;
    background: var(--fondo);
    border: 1px solid var(--borde);
    padding: 9px 11px;
    min-width: 0;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--propio); outline-offset: 1px; }
  #nombre { width: 110px; }
  #texto { flex: 1; }
  button {
    font: inherit;
    background: var(--propio);
    color: var(--propio-texto);
    border: 0;
    padding: 9px 16px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
  <main class="chat">
    <header>
      <h1>Chat en vivo</h1>
      <span id="estado">Conectando…</span>
    </header>
    <div id="mensajes" aria-live="polite"></div>
    <form id="form">
      <input id="nombre" placeholder="Tu nombre" maxlength="20" autocomplete="off">
      <input id="texto" placeholder="Escribí un mensaje" maxlength="500" autocomplete="off">
      <button id="enviar" type="submit" disabled>Enviar</button>
    </form>
  </main>

<script>
  const mensajes = document.getElementById('mensajes');
  const estado = document.getElementById('estado');
  const form = document.getElementById('form');
  const inputNombre = document.getElementById('nombre');
  const inputTexto = document.getElementById('texto');
  const botonEnviar = document.getElementById('enviar');

  inputNombre.value = 'Usuario' + Math.floor(Math.random() * 900 + 100);

  let total = 0;
  const ws = new WebSocket('ws://' + location.host);

  ws.onopen = () => {
    estado.textContent = 'Conectado';
    botonEnviar.disabled = false;
  };
  ws.onclose = () => {
    estado.textContent = 'Desconectado. Recargá la página.';
    botonEnviar.disabled = true;
  };
  ws.onerror = () => { estado.textContent = 'Error de conexión'; };

  ws.onmessage = (evento) => {
    const msg = JSON.parse(evento.data);
    if (msg.type === 'usuarios') {
      total = msg.total;
      estado.textContent = total + (total === 1 ? ' persona conectada' : ' personas conectadas');
    } else if (msg.type === 'mensaje') {
      agregarMensaje(msg);
    }
  };

  function agregarMensaje({ nombre, texto, hora }) {
    const div = document.createElement('div');
    div.className = 'msg' + (nombre === inputNombre.value.trim() ? ' propio' : '');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = nombre + ' · ' + new Date(hora).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    const cuerpo = document.createElement('div');
    cuerpo.textContent = texto; // textContent evita inyección de HTML
    div.append(meta, cuerpo);
    mensajes.appendChild(div);
    mensajes.scrollTop = mensajes.scrollHeight;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const texto = inputTexto.value.trim();
    if (!texto || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ nombre: inputNombre.value.trim() || 'Anónimo', texto }));
    inputTexto.value = '';
    inputTexto.focus();
  });
</script>
</body>
</html>
